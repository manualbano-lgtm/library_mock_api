<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Library API Documentation</title>
  <!-- Load Swagger UI standard stylesheets directly from CDN -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <style>
    html { box-sizing: border-box; overflow: -index-overflow-style; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <!-- Container where Swagger UI elements append -->
  <div id="swagger-ui"></div>

  <!-- Load official Swagger UI bundle scripts -->
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: 'openapi.yaml', // Points to YAML file
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        // Instructs Swagger UI to auto-generate code snippets dynamically
        requestSnippetsEnabled: true
      });
    };
  </script>
</body>
</html>
