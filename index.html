<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Library API Reference Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Clean font loading for the multi-column interface layout -->
  <link href="https://googleapis.com|Roboto:300,400,700" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #loading-box { padding: 50px; text-align: center; color: #555; font-size: 18px; }
  </style>
</head>
<body>

  <!-- 1. The target viewport where Redocly will construct the 3-column system -->
  <div id="api-docs-viewport">
    <div id="loading-box">Initializing Library Specification Engine...</div>
  </div>

  <!-- 2. Pure, stable standalone package deployment asset -->
  <script src="https://redoc.ly"></script>
  
  <script>
    // 3. Force direct script initialization to bypass browser tag blocks
    Redoc.init(
      'openapi.yaml', // 👈 Ensure your filename matches this lowercase format exactly!
      {
        disableSearch: false,
        expandResponses: "200,201",
        theme: {
          colors: {
            primary: { main: '#333333' }
          }
        }
      },
      document.getElementById('api-docs-viewport'),
      function(error) {
        if (error) {
          console.error("Initialization suspended: ", error);
          document.getElementById('loading-box').innerHTML = 
            "<h3 style='color:#d9534f;'>Documentation Rendering Suspended</h3>" +
            "<p>The browser could not locate 'openapi.yaml'. Verify the filename casing in your repository.</p>";
        }
      }
    );
  </script>
</body>
</html>
