<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>API Reference Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Standard Swagger UI Layout Stylesheets -->
  <link rel="stylesheet" href="https://jsdelivr.net" />
  <style>
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>

  <!-- The target container where the interactive console will load -->
  <div id="swagger-ui"></div>

  <!-- Standard Swagger UI Distribution Bundles -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        // 1. Yaml file
        url: 'openapi.yaml', 
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        // 2. Automatically generates interactive copy-paste cURL snippet tabs
        requestSnippetsEnabled: true 
      });
    };
  </script>
</body>
</html>
